<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Aquí aplicamos la Custom Property de Bootstrap */
        .seccion-violeta {
            --bs-primary: #6f42c1; /* Definimos el nuevo color primario para esta zona */
        }

        /* Forzamos al botón a usar la variable que definimos arriba */
        .seccion-violeta .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
    </style>
</head>
<body class="p-5">

    <div class="seccion-violeta mb-4">
        <button class="btn btn-primary">Soy Violeta por Custom Property</button>
    </div>

    <div>
        <button class="btn btn-primary">Sigo siendo Azul (Bootstrap default)</button>
    </div>

</body>
</html>
