<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameConnect | Red Social</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="auth-container" class="container">
        <div class="row justify-content-center align-items-center vh-100">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <h2 class="text-center fw-bold text-primary mb-4">🎮 GameConnect</h2>
                    <div id="login-form">
                        <h4 class="text-center mb-3">Iniciar Sesión</h4>
                        <input type="text" id="login-user" class="form-control mb-3" placeholder="Usuario">
                        <input type="password" id="login-pass" class="form-control mb-3" placeholder="Contraseña">
                        <button class="btn btn-primary w-100 rounded-pill mb-3 fw-bold" onclick="handleLogin()">Entrar</button>
                        <p class="text-center small">¿No tienes cuenta? <a href="#" onclick="toggleAuth(true)">Regístrate</a></p>
                    </div>
                    <div id="register-form" class="hidden">
                        <h4 class="text-center mb-3">Crear Cuenta</h4>
                        <input type="text" id="reg-user" class="form-control mb-3" placeholder="Usuario">
                        <input type="password" id="reg-pass" class="form-control mb-3" placeholder="Contraseña">
                        <button class="btn btn-success w-100 rounded-pill mb-3 fw-bold" onclick="handleRegister()">Registrarse</button>
                        <p class="text-center small">¿Ya tienes cuenta? <a href="#" onclick="toggleAuth(false)">Inicia sesión</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-content" class="hidden">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#" onclick="showSection('feed')">🎮 GameConnect</a>
                <div class="ms-auto">
                    <span id="nav-username" class="text-white me-3 fw-bold small"></span>
                    <button class="btn btn-sm btn-outline-light rounded-pill" onclick="logout()">Salir</button>
                </div>
            </div>
        </nav>

        <div class="container my-4">
            <div class="row">
                <aside class="col-lg-3">
                    <div class="card shadow-sm text-center p-3 border-0 rounded-4 mb-4">
                        <img id="profile-avatar" src="" class="profile-avatar-large mx-auto d-block mb-3">
                        <h5 id="profile-name" class="mb-0"></h5>
                        <p id="profile-user-handle" class="text-muted small"></p>
                        <div id="achievementsContainer" class="d-flex flex-wrap justify-content-center gap-1"></div>
                        <button class="btn btn-sm btn-outline-primary mt-3 w-100 rounded-pill" onclick="toggleTheme()">🌙 Modo Oscuro</button>
                    </div>
                    <div class="card shadow-sm border-0 p-3 rounded-4 d-none d-lg-block">
                        <h6 class="fw-bold mb-3">Tendencias</h6>
                        <ul class="list-unstyled mb-0 small">
                            <li class="mb-2 text-primary fw-bold">#ReadyOrNot</li>
                            <li class="mb-2 text-primary fw-bold">#GamingPopayan</li>
                        </ul>
                    </div>
                </aside>

                <main class="col-lg-9">
                    <div class="d-flex gap-2 mb-4">
                        <button class="btn btn-primary rounded-pill px-4" onclick="showSection('feed')">Inicio</button>
                        <button class="btn btn-outline-primary rounded-pill px-4" onclick="showSection('games')">Mis Juegos</button>
                    </div>

                    <section id="section-feed">
                        <div class="card shadow-sm border-0 mb-4 rounded-4">
                            <div class="card-body">
                                <textarea id="postInput" class="form-control border-0 bg-light mb-2" rows="2" placeholder="¿Qué estás jugando?"></textarea>
                                <button onclick="publicarPost()" class="btn btn-primary btn-sm float-end px-4 rounded-pill fw-bold">Publicar</button>
                            </div>
                        </div>
                        <div id="feedContainer"></div>
                    </section>

                    <section id="section-games" class="hidden">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="fw-bold">Mis Juegos</h2>
                            <button class="btn btn-success btn-sm rounded-pill" data-bs-toggle="modal" data-bs-target="#gameModal">+ Nuevo</button>
                        </div>
                        <div id="gamesGrid" class="row"></div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    <div class="modal fade" id="gameModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content border-0 rounded-4">
        <div class="modal-header border-0 bg-primary text-white"><h5 class="modal-title fw-bold">Nuevo Juego</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
            <input type="text" id="gameTitle" class="form-control mb-3" placeholder="Nombre">
            <input type="text" id="gameImg" class="form-control mb-3" placeholder="URL Imagen">
            <select id="gameStatus" class="form-select"><option value="Pendiente">Pendiente</option><option value="Jugando">Jugando</option><option value="Completado">Completado</option></select>
        </div>
        <div class="modal-footer border-0"><button class="btn btn-primary w-100 rounded-pill" onclick="saveGame()" data-bs-dismiss="modal">Guardar</button></div>
    </div></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
